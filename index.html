  .card {

  .grad-bar { background: var(--grad); }
  .chip { background: var(--chip-bg); color: var(--brand); border-radius: 7px; }
  .divider { border-color: var(--line); }

  .feed-enter { opacity: 0; transform: translateY(-9px); }
  .focusable:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 7px; }
  .toast { transition: opacity .24s ease, transform .24s ease; }
  .toast.hide { opacity: 0; transform: translateY(8px); pointer-events: none; }

  #sheet-wrap.hide { opacity: 0; pointer-events: none; }
  #sheet { transition: transform .3s cubic-bezier(.33,0,.15,1); }
  #sheet-wrap.hide #sheet { transform: translateY(102%); }

  .blink { animation: blink 1.6s ease-in-out infinite; }

  .dash-run { stroke-dasharray: 6 8; animation: dashRun 1.6s linear infinite; }

    .bar, .feed-item, .toast, .card, #sheet { transition: none; }
    .pulse, .blink, .sweep, .spin-slow, .dash-run { animation: none !important; }
  }

/* ============ 通用工具 ============ */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
let uidSeq = 0;
const uid = (p) => p + (++uidSeq);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const LEVEL = { '点': 92, '满': 82, '较忙': 62, '适中': 38, '空闲': 18 };
function queueTone(q) { return q >= 80 ? 'var(--warn)' : q >= 50 ? '#E8A33D' : q >= 25 ? 'var(--brand)' : 'var(--eco)'; }
function queueWord(q) { return q >= 80 ? '拥挤' : q >= 50 ? '较忙' : q >= 25 ? '适中' : '空闲'; }
function densityTone(d) { return d >= 25 ? 'var(--warn)' : d >= 15 ? '#E8A33D' : d >= 8 ? 'var(--brand)' : 'var(--eco)'; }
function densityWord(d) { return d >= 25 ? '拥挤' : d >= 15 ? '较忙' : d >= 8 ? '适中' : '空闲'; }

/* ============ 迷你图表 ============ */
function spark(data, color, opt) {
  opt = opt || {};
  const w = opt.w || 300, h = opt.h || 48, gid = uid('sp');
  if (!data || !data.length) return '';
  const max = Math.max.apply(null, data.concat([1])), min = Math.min.apply(null, data.concat([0]));
  const x = (i) => (i * (w - 8) / (data.length - 1 || 1)) + 4;
  const y = (v) => h - 7 - ((v - min) / ((max - min) || 1)) * (h - 18);
  const line = data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = line + ' L' + x(data.length - 1).toFixed(1) + ' ' + h + ' L4 ' + h + ' Z';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="w-full block" preserveAspectRatio="none" aria-hidden="true">'
    + '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="' + color + '" stop-opacity=".30"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>'
    + (opt.fill === false ? '' : '<path d="' + area + '" fill="url(#' + gid + ')"/>')
    + '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + x(data.length - 1).toFixed(1) + '" cy="' + y(data[data.length - 1]).toFixed(1) + '" r="2.6" fill="' + color + '"/></svg>';
}
function bars(data, color, h) {
  h = h || 42; const w = 300, n = data.length, max = Math.max.apply(null, data.concat([1]));
  const bw = (w - 8) / n - 3;
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="w-full block" preserveAspectRatio="none" aria-hidden="true">'
    + data.map(function (v, i) {
      const bh = Math.max(2, (v / max) * (h - 6));
      return '<rect x="' + (4 + i * ((w - 8) / n)).toFixed(1) + '" y="' + (h - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="1.6" fill="' + color + '" opacity="' + (0.42 + 0.58 * (v / max)).toFixed(2) + '"/>';
    }).join('') + '</svg>';
}
function ring(pct, color, size, sub) {
  size = size || 62; const r = size / 2 - 5, c = 2 * Math.PI * r;
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" style="width:' + size + 'px;height:' + size + 'px" aria-hidden="true">'
    + '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="currentColor" stroke-opacity=".16" stroke-width="5"/>'
    + '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="5" stroke-linecap="round"'
    + ' stroke-dasharray="' + (c * clamp(pct, 0, 100) / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>'
    + (sub ? '<text x="' + size / 2 + '" y="' + (size / 2 + 4) + '" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">' + sub + '</text>' : '')

}
const barRow = (pct, color) => '<div class="h-1.5 rounded-full overflow-hidden" style="background:var(--brand-soft)"><div class="h-full bar rounded-full" style="width:' + clamp(pct, 1, 100) + '%;background:' + (color || 'var(--grad)') + '"></div></div>';

/* ============ 地图 ============ */
function renderMap(mode, opt) {
  opt = opt || {};

  const ops = mode === 'ops';
  let h = '';
  h += ART.terrain(u);
  /* 雪道 */
  h += '<g opacity="' + (ops ? .95 : .9) + '">';
  MAP.trails.forEach(function (t) {
    const tr = TRAILS[t.id];
    if (!tr.open) return;
    h += '<path d="' + t.d + '" fill="none" stroke="' + t.color + '" stroke-width="' + (ops ? 3 : 2.6) + '" stroke-linecap="round"'
      + (tr.line === 'dash' ? ' stroke-dasharray="9 6"' : tr.line === 'dot' ? ' stroke-dasharray="2 5"' : '') + ' opacity=".85"/>';
  });
  h += '</g>';
  /* 索道 */
  MAP.lifts.forEach(function (l) {
    const lf = LIFTS[l.id];
    h += '<path d="' + l.path + '" fill="none" stroke="#BFE3FF" stroke-opacity="' + (lf.on ? .55 : .2) + '" stroke-width="1.2" stroke-dasharray="4 5"/>';
    if (lf.on) {
      h += '<g><circle r="2.4" fill="#7FE3C0"><animateMotion dur="' + (5 + l.id * 0.6).toFixed(1) + 's" repeatCount="indefinite" path="' + l.path + '"/></circle></g>';
      h += '<g><circle r="2.4" fill="#7FE3C0"><animateMotion dur="' + (5 + l.id * 0.6).toFixed(1) + 's" begin="-' + (2.5 + l.id * 0.3).toFixed(1) + 's" repeatCount="indefinite" path="' + l.path + '"/></circle></g>';
    }
    h += '<text x="' + (l.x + 5) + '" y="' + (l.y + 3) + '" font-size="7" fill="#BFE3FF" opacity="' + (lf.on ? .9 : .45) + '">' + l.label + '</text>';
  });
  /* 密度热区 */
  if (ops) {
    MAP.pins.forEach(function (p) {
      if (p.k !== 'trail') return;
      const d = TRAILS[p.id].density, r = 10 + d * 0.85;
      h += '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + r.toFixed(0) + '" fill="' + densityTone(d) + '" opacity=".16"/>';
    });
  }
  /* 山顶标记 */
  h += '<g><path d="M170 30 L162 42 L178 42 Z" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.2"/>'
    + '<text x="170" y="26" font-size="7.5" text-anchor="middle" fill="#FFFFFF" opacity=".8">2110.3 m</text></g>';
  /* 点位 */
  MAP.pins.forEach(function (p, i) {
    const tone = p.tone === 'warn' ? '#FF6B35' : p.tone === 'muted' ? '#9CC7E8' : '#2FA8FF';
    h += '<g class="map-pin" data-sheet="pin:' + i + '" style="cursor:pointer">'
      + '<circle cx="' + p.x + '" cy="' + p.y + '" r="5" fill="none" stroke="' + tone + '" class="pulse" style="animation-delay:' + (i * .28).toFixed(2) + 's"/>'
      + '<circle cx="' + p.x + '" cy="' + p.y + '" r="3.4" fill="' + tone + '"/>'
      + '<circle cx="' + p.x + '" cy="' + p.y + '" r="1.4" fill="#062033"/>'
      + '<text x="' + (p.x + 6) + '" y="' + (p.y - 4) + '" font-size="7" fill="#FFFFFF" opacity=".92">' + p.label + '</text></g>';
  });
  return '<div class="relative rounded-[12px] overflow-hidden" style="border:1px solid ' + (ops ? 'rgba(0,198,255,.22)' : 'var(--line)') + '">'
    + '<svg viewBox="0 0 340 300" class="w-full block">' + h + '</svg>'
    + (opt.legend === false ? '' : '<div class="absolute left-2.5 top-2.5 flex flex-col gap-1 text-[9px]" style="color:#CFE8FF">'
      + '<span class="px-1.5 py-0.5 rounded" style="background:rgba(6,26,46,.62)">● 点位可点开详情</span>'
      + '<span class="px-1.5 py-0.5 rounded" style="background:rgba(6,26,46,.62)">— 索道（绿点为运行中轿厢）</span></div>')
    + (opt.legend === false ? '' : '<div class="absolute right-2.5 bottom-2.5 flex flex-wrap gap-x-2 gap-y-0.5 justify-end text-[9px]" style="color:#CFE8FF;max-width:190px">'
      + '<span class="px-1.5 py-0.5 rounded" style="background:rgba(6,26,46,.62)">橙=高级</span>'
      + '<span class="px-1.5 py-0.5 rounded" style="background:rgba(6,26,46,.62)">蓝=中级</span>'
      + '<span class="px-1.5 py-0.5 rounded" style="background:rgba(6,26,46,.62)">绿=初级</span></div>')
    + '</div>';
}

];
let neIdx = 0;
function pushEvent() {
  const t = new Date();
  const pad = (n) => (n < 10 ? '0' : '') + n;
  const ne = Object.assign({}, NEW_EVENTS[neIdx++ % NEW_EVENTS.length]);
  ne.t = pad(t.getHours()) + ':' + pad(t.getMinutes());
  ne.done = ne.dur === '已闭环';
  EVENTS.push(ne);
  feedList.push({ e: ne, idx: EVENTS.length - 1 });
  if (feedList.length > 24) feedList.shift();
  ['#feed', '#feed2'].forEach(function (sel) {
    const el = $(sel); if (!el) return;
    el.insertAdjacentHTML('afterbegin', feedItem(feedList[feedList.length - 1]));
    const first = el.firstElementChild;
    first.classList.add('feed-enter');
    requestAnimationFrame(function () { requestAnimationFrame(function () { first.classList.remove('feed-enter'); }); });
    while (el.children.length > 6) el.removeChild(el.lastElementChild);
  });
}

/* ============ 实时数值刷新（演示示意值） ============ */
function eachText(el, re, val) {
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  let n;
  while ((n = w.nextNode())) { if (re.test(n.nodeValue)) { n.nodeValue = n.nodeValue.replace(re, val); return true; } }
  return false;
}
function setBar(root, pct, color) {
  const b = root.querySelector('.bar');
  if (b) { b.style.width = clamp(pct, 1, 100) + '%'; if (color) b.style.background = color; }
}
function tickLifts() {
  LIFTS.forEach(function (L, i) {
    if (!L.on) return;
    L.queue = clamp(L.queue + Math.round((Math.random() - 0.5) * 16), 4, 126);
    L.trend.push(L.queue); if (L.trend.length > 8) L.trend.shift();
    const tone = queueTone(L.queue), word = queueWord(L.queue);
    $$('[data-sheet="lift:' + i + '"]').forEach(function (row) {
      eachText(row, /\d+(?=\s*人?$)/, String(L.queue));
      eachText(row, /^(拥挤|较忙|适中|空闲)$/, word);
      setBar(row, L.queue, tone);
      const fm = row.querySelector('.font-mono');
      if (fm) fm.style.color = tone;
    });
  });
}
function tickTrails() {
  TRAILS.forEach(function (T, i) {
    if (!T.open) return;
    const band = T.density >= 25 ? [25, 36] : T.density >= 15 ? [15, 24] : T.density >= 8 ? [8, 14] : [3, 7];
    T.density = clamp(T.density + Math.round((Math.random() - 0.5) * 4), band[0], band[1]);
    T.trend.push(T.density); if (T.trend.length > 8) T.trend.shift();
    const tone = densityTone(T.density), word = densityWord(T.density);
    $$('[data-sheet="trail:' + i + '"]').forEach(function (row) {
      eachText(row, /^\d+$/, String(T.density));
      eachText(row, /^(拥挤|较忙|适中|空闲)$/, word);
      setBar(row, T.density * 3, tone);
      const fm = row.querySelector('.font-mono');
      if (fm) fm.style.color = tone;
    });
  });
}
function tickClock() {
  const d = new Date(), p = (n) => (n < 10 ? '0' : '') + n;
  const el = $('#clock'); if (el) el.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* ============ 事件绑定 ============ */
document.addEventListener('click', function (ev) {
  const role = ev.target.closest('.role-btn');
  if (role) { setRole(role.dataset.role); return; }
  const tab = ev.target.closest('[data-tab]');
  if (tab) { switchTab(Number(tab.dataset.tab)); return; }
  const act = ev.target.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (/确认兑换/.test(a)) { toast('兑换请求已提交，可在「我的」中查看凭证（演示）'); closeSheet(); }
    else if (/呼叫巡逻/.test(a)) { toast('已呼叫雪地巡逻队，预计 4 分钟抵达（演示）'); closeSheet(); }
    else if (/呼叫/.test(a)) { toast('正在呼叫 ' + a.replace('呼叫 ', '') + '（演示）'); }
    else { toast('已执行「' + a + '」（演示，未下发真实系统）'); }
    return;
  }
  if (ev.target.closest('.sheet-close')) { closeSheet(); return; }
  const wrap = ev.target.closest('#sheet-wrap');
  if (wrap && (ev.target === wrap || ev.target.parentElement === wrap)) { closeSheet(); return; }
  const hit = ev.target.closest('[data-sheet]');
  if (hit) {
    const parts = hit.dataset.sheet.split(':');
    openSheet(parts[0], parts[1]);
  }
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeSheet(); });

/* ============ 初始化 ============ */
renderTabs();
renderViews();
$$('.role-btn').forEach(function (b) {
  const on = b.dataset.role === state.role;
  b.style.background = on ? 'var(--surface)' : 'transparent';
  b.style.color = on ? 'var(--brand)' : 'var(--muted)';
  b.style.boxShadow = on ? '0 1px 3px rgba(15,42,64,.12)' : 'none';
});
document.addEventListener('click', function (ev) {
  const r = ev.target.closest('.role-btn');
  if (!r) return;
  $$('.role-btn').forEach(function (b) {
    const on = b.dataset.role === r.dataset.role;
    b.style.background = on ? 'var(--surface)' : 'transparent';
    b.style.color = on ? 'var(--brand)' : 'var(--muted)';
    b.style.boxShadow = on ? '0 1px 3px rgba(15,42,64,.12)' : 'none';
  });
});
tickClock();
setInterval(tickClock, 1000);
setInterval(tickLifts, 6000);
setInterval(tickTrails, 6000);
setInterval(pushEvent, 9000);
</script>
</body>
